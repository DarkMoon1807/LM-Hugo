<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Formularios</title>
    <link rel='stylesheet' href='main.css'>
</head>
<body>
    Vamos a probar diferentes valores de <em>type</em>de HTML5 para la etiqueta <em>input</em>
    <fieldset>
        <legend>Para datos personales</legend>
        <label for="telefono">Teléfono</label>
        <input type="tel" placeholder="9 números" size="9" maxlength="9" pattern="0-9" autocomplete="on"/><br/>
        <label for="correo">Correo electrónico</label>
        <input type="email" placeholder="El formato correcto es nombre+@+servidor de correo" size="38" autocomplete="on"/>
    </fieldset>
    <fieldset>
        <legend>Para valore numéricos</legend>
        <label for="numero_personas">Número de personas</label>
        <input type="number" value="1" min="1" max="20" step="1"/><br/>
        <label for="puntuacion">Mueva la barra para indicar puntuación (Del 1 al 10)</label>
        <input type="range" min="0" max="10" step="1" value="0"/>
    </fieldset>
    <fieldset>
        <legend>Url y búsqueda</legend>
        <label for="url">Url de tu sitio</label>
        <input type="url"/><br/>
        <label for="buscar">¿Qué te interesa buscar?</label>
        <input type="search"/>
    </fieldset>
    <fieldset>
        <legend>Otros tipos</legend>
        <label for="color">Color</label>
        <input type="color"/>
    </fieldset>
    <fieldset>
        <legend>Para Fechas</legend>
        <label for="dia">Seleccione un día (Hasta fin de año):</label>
        <input type="date" max="2026-12-31"/><br/>
        <label for="hora">Seleccione una hora:</label>
        <input type="time"/><br/>
        <label for="mes">Seleccione un mes (Hasta junio del 2020):</label>
        <input type="month"/><br/>
        <label for="semana">Seleccione una semana (Hasta junio del 2020):</label>
        <input type="week"/><br/>
        <label for="fecha_hora">Seleccione fecha y hora:</label>
        <input type="datetime-local"/><br/>
    </fieldset>
    <input type="button" value="Validar" src="aceptar.jpg" width="50" height="50"/>
    <input type="button" value="Limpiar" src="limpiar.jpeg" width="50" height="50"/>
</body>
</html>
